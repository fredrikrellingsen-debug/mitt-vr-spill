<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Blink-Spill (WebXR)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050814; font-family: sans-serif; }
    #hud {
      position: fixed; top: 16px; left: 16px; color: #00f0ff;
      background: rgba(5, 8, 20, 0.75); padding: 12px 16px;
      border: 1px solid #00f0ff; border-radius: 8px; pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">Poeng: <span id="score">0</span> | Klikk med mus eller trykk «ENTER VR»</div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    // 1. Scene, kamera og renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b19);
    scene.fog = new THREE.FogExp2(0x070b19, 0.035);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    // 2. Lys og rutenett-gulv
    scene.add(new THREE.HemisphereLight(0xffffff, 0x223355, 1.2));
    const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.5);
    dirLight.position.set(3, 8, 4);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(40, 40, 0x00f0ff, 0x162244);
    scene.add(grid);

    // 3. Lydgenerator (ingen eksterne lydfiler nødvendig)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playHitSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(520, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // 4. Blinker (targets)
    const targets = [];
    const targetGeo = new THREE.OctahedronGeometry(0.35, 1);
    let score = 0;
    const scoreEl = document.getElementById('score');

    function spawnTarget() {
      const mat = new THREE.MeshStandardMaterial({
        color: 0xff2a85, emissive: 0x660033, roughness: 0.2, metalness: 0.5
      });
      const mesh = new THREE.Mesh(targetGeo, mat);
      mesh.position.set(
        (Math.random() - 0.5) * 6,
        1.0 + Math.random() * 2.2,
        -3.5 - Math.random() * 4.5
      );
      mesh.userData.speed = 0.5 + Math.random() * 1.2;
      mesh.userData.offset = Math.random() * Math.PI * 2;
      scene.add(mesh);
      targets.push(mesh);
    }

    for (let i = 0; i < 6; i++) spawnTarget();

    // 5. VR-kontrollere med laserstråle
    const raycaster = new THREE.Raycaster();
    const tempMatrix = new THREE.Matrix4();

    function checkHit(ray) {
      const hits = ray.intersectObjects(targets);
      if (hits.length > 0) {
        const hitObj = hits[0].object;
        scene.remove(hitObj);
        targets.splice(targets.indexOf(hitObj), 1);
        score += 10;
        scoreEl.textContent = score;
        playHitSound();
        spawnTarget();
      }
    }

    for (let i = 0; i < 2; i++) {
      const controller = renderer.xr.getController(i);
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -8)
      ]);
      const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x00f0ff }));
      controller.add(line);

      controller.addEventListener('selectstart', () => {
        tempMatrix.identity().extractRotation(controller.matrixWorld);
        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);
        checkHit(raycaster);
      });
      scene.add(controller);
    }

    // 6. Museklikk-støtte for testing på vanlig PC-skjerm
    const pointer = new THREE.Vector2();
    window.addEventListener('pointerdown', (e) => {
      if (renderer.xr.isPresenting) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      checkHit(raycaster);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. Spill-løkke
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      targets.forEach((target) => {
        target.rotation.y += 0.02;
        target.rotation.x += 0.01;
        target.position.x += Math.sin(t * target.userData.speed + target.userData.offset) * 0.012;
      });
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
