<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Western Cowboy VR (WebXR)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #8ec5e8;
      font-family: Georgia, 'Times New Roman', serif;
      user-select: none;
    }
    #top-left-ui {
      position: fixed;
      top: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
    }
    #hud-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    #hud {
      color: #fff4dc;
      background: rgba(42, 24, 12, 0.9);
      padding: 10px 18px;
      border: 2px solid #d9a04e;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      font-size: 15px;
      line-height: 1.45;
      letter-spacing: 0.3px;
      white-space: pre-line;
    }
    #lang-btn {
      pointer-events: auto;
      cursor: pointer;
      color: #fff4dc;
      background: rgba(58, 33, 16, 0.94);
      padding: 8px 14px;
      border: 2px solid #e5b25d;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.4px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    #lang-btn:hover {
      background: rgba(86, 50, 24, 0.98);
    }
    #lang-btn:active {
      transform: scale(0.97);
    }
    #pc-hint {
      color: #fff4dc;
      background: rgba(42, 24, 12, 0.75);
      padding: 6px 12px;
      border: 1px solid rgba(217, 160, 78, 0.65);
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 12px;
      line-height: 1.5;
    }
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border: 2px solid rgba(255, 238, 190, 0.85);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      z-index: 9;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="top-left-ui">
    <div id="hud-row">
      <div id="hud">Health: 100 | Food: 0 (E = eat) | Pelts: 0 | Outfit: Plain | Time: Day</div>
      <button id="lang-btn" type="button" title="Switch language (EN / NO)">Language: EN / NO</button>
    </div>
    <div id="pc-hint"></div>
  </div>
  <div id="crosshair"></div>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { I18N, drawRoundedRect, drawSheriffStar2D } from './js/i18n.js';
    import { initTexturesAndMaterials } from './js/textures.js';
    import { initCreatureModels } from './js/creatures.js';
    import { applySkyShaderParams, getTerrainHeight, buildEnvironmentAndScenery } from './js/world.js';
    import { buildTownBuildings } from './js/buildings.js';
    import { initWesternAudio } from './js/audio.js';
    import { initRevolverAndAtmosphereFX } from './js/revolver-fx.js';

    // =========================================================================
    // 1. SCENE, RENDERER OG SPILLER-RIGG (playerRig)
    // =========================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd99b66);
    scene.fog = new THREE.Fog(0xe2b483, 48, 285);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 560);
    camera.position.set(0, 1.65, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    // Spiller-rigg som samler kamera og begge VR-kontrollerne
    const playerRig = new THREE.Group();
    playerRig.position.set(0, 0, 14.5);
    playerRig.add(camera);
    scene.add(playerRig);

    // Lydkontekst klar for videre spillmekanikk
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    // =========================================================================
    // 2. SENTRALT SPRÅKSYSTEM (EN STANDARD / NO VALG), STATUS OG WRISTBOARD
    // =========================================================================
    let currentLang = 'en';

    function L() {
      return I18N[currentLang] || I18N.en;
    }

    const playerState = {
      health: 100,
      food: 0,
      pelt: 0,
      outfit: 'Plain',
      timeOfDay: 'Day',
      targets: 0,
      title: ''
    };

    // Globale kamp-, våpen-, rustnings- og oppdragsvariabler
    let damageMultiplier = 1.0;
    let nightMonsterDamage = 1;
    let currentOutfitTier = 0;

    let weaponDamage = 1;
    let activeQuest = null;
    let questProgress = 0;
    const completedQuests = [];
    const questProgressMap = Object.create(null);
    let hasSheriffStar = false;
    let hasGoldenRevolver = false;
    let hasLegendTitle = false;
    let isNightStateFlag = false;

    const hudEl = document.getElementById('hud');
    const pcHintEl = document.getElementById('pc-hint');
    const langBtnEl = document.getElementById('lang-btn');

    function syncLocalizedStateStrings() {
      const dict = L();
      playerState.outfit = dict.outfits[currentOutfitTier] || dict.outfits[0];
      playerState.timeOfDay = isNightStateFlag ? dict.night : dict.day;
      playerState.title = hasLegendTitle ? dict.legendTitle : '';
    }

    // Venstre håndleddsgruppe: inneholder erme/mansjett, Sheriff-stjerne, wristBoard, spiseknapp og språkknapp
    const leftWristRig = new THREE.Group();

    const leftSleeveMat = new THREE.MeshLambertMaterial({ color: 0xc8b28e });
    const leftCuffMat = new THREE.MeshLambertMaterial({ color: 0x8c6d46 });

    const leftSleeveMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.045, 0.056, 0.21, 10),
      leftSleeveMat
    );
    leftSleeveMesh.rotation.x = Math.PI / 2;
    leftSleeveMesh.position.set(0, -0.015, 0.115);
    leftWristRig.add(leftSleeveMesh);

    const leftCuffMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.049, 0.049, 0.032, 10),
      leftCuffMat
    );
    leftCuffMesh.rotation.x = Math.PI / 2;
    leftCuffMesh.position.set(0, -0.015, 0.02);
    leftWristRig.add(leftCuffMesh);

    // Gullfarget 3D Sheriff-stjerne på venstre håndledd (låses opp av Oppdrag 1)
    const sheriffStarBadge = new THREE.Group();
    const sheriffGoldMat = new THREE.MeshStandardMaterial({
      color: 0xffd24a,
      emissive: 0x3b2600,
      metalness: 0.88,
      roughness: 0.22
    });
    const starTriGeo = new THREE.CylinderGeometry(0.024, 0.024, 0.005, 3);
    const starTriA = new THREE.Mesh(starTriGeo, sheriffGoldMat);
    const starTriB = new THREE.Mesh(starTriGeo, sheriffGoldMat);
    starTriB.rotation.y = Math.PI;
    sheriffStarBadge.add(starTriA);
    sheriffStarBadge.add(starTriB);

    const starCenterBoss = new THREE.Mesh(
      new THREE.CylinderGeometry(0.009, 0.009, 0.007, 10),
      sheriffGoldMat
    );
    sheriffStarBadge.add(starCenterBoss);

    const starTipGeo = new THREE.SphereGeometry(0.0032, 6, 5);
    for (let i = 0; i < 6; i++) {
      const tipAngle = (i * Math.PI) / 3;
      const tip = new THREE.Mesh(starTipGeo, sheriffGoldMat);
      tip.position.set(Math.sin(tipAngle) * 0.024, 0, Math.cos(tipAngle) * 0.024);
      sheriffStarBadge.add(tip);
    }
    sheriffStarBadge.position.set(-0.018, 0.036, 0.045);
    sheriffStarBadge.rotation.set(0.2, 0, 0.28);
    sheriffStarBadge.visible = false;
    leftWristRig.add(sheriffStarBadge);

    function updateLeftSleeveAppearance(tier) {
      if (tier === 1) {
        leftSleeveMat.color.setHex(0x8f491d);
        leftCuffMat.color.setHex(0xd49b4b);
      } else if (tier === 2) {
        leftSleeveMat.color.setHex(0x636d7a);
        leftCuffMat.color.setHex(0xdce2ec);
      } else if (tier === 3) {
        leftSleeveMat.color.setHex(0x5e1124);
        leftCuffMat.color.setHex(0xe8bd54);
      } else {
        leftSleeveMat.color.setHex(0xc8b28e);
        leftCuffMat.color.setHex(0x8c6d46);
      }
    }

    const wristCanvas = document.createElement('canvas');
    wristCanvas.width = 640;
    wristCanvas.height = 384;
    const wristCtx = wristCanvas.getContext('2d');

    const wristTexture = new THREE.CanvasTexture(wristCanvas);
    wristTexture.colorSpace = THREE.SRGBColorSpace;
    wristTexture.anisotropy = maxAnisotropy;

    const wristBoard = new THREE.Mesh(
      new THREE.PlaneGeometry(0.28, 0.168),
      new THREE.MeshBasicMaterial({
        map: wristTexture,
        transparent: true,
        side: THREE.DoubleSide,
        fog: false,
        toneMapped: false
      })
    );
    wristBoard.position.set(0.055, 0.06, -0.04);
    wristBoard.rotation.set(-0.65, 0.25, 0.15);
    leftWristRig.add(wristBoard);

    // Klikkbar 3D-spiseknapp rett under wristBoard på venstre håndledd
    const eatBtnCanvas = document.createElement('canvas');
    eatBtnCanvas.width = 384;
    eatBtnCanvas.height = 96;
    const eatBtnCtx = eatBtnCanvas.getContext('2d');

    const eatBtnTexture = new THREE.CanvasTexture(eatBtnCanvas);
    eatBtnTexture.colorSpace = THREE.SRGBColorSpace;
    eatBtnTexture.anisotropy = maxAnisotropy;

    const eatWristButton = new THREE.Mesh(
      new THREE.PlaneGeometry(0.192, 0.05),
      new THREE.MeshBasicMaterial({
        map: eatBtnTexture,
        transparent: true,
        side: THREE.DoubleSide,
        fog: false,
        toneMapped: false
      })
    );
    eatWristButton.position.set(-0.044, -0.116, 0.002);
    wristBoard.add(eatWristButton);

    // Klikkbar 3D-språkknapp (EN / NO) ved siden av spiseknappen på wristBoard i VR
    const langWristCanvas = document.createElement('canvas');
    langWristCanvas.width = 192;
    langWristCanvas.height = 96;
    const langWristCtx = langWristCanvas.getContext('2d');

    const langWristTexture = new THREE.CanvasTexture(langWristCanvas);
    langWristTexture.colorSpace = THREE.SRGBColorSpace;
    langWristTexture.anisotropy = maxAnisotropy;

    const langWristButton = new THREE.Mesh(
      new THREE.PlaneGeometry(0.082, 0.05),
      new THREE.MeshBasicMaterial({
        map: langWristTexture,
        transparent: true,
        side: THREE.DoubleSide,
        fog: false,
        toneMapped: false
      })
    );
    langWristButton.position.set(0.099, -0.116, 0.002);
    wristBoard.add(langWristButton);

    function updateEatWristButton() {
      const dict = L();
      const canEat = playerState.food > 0 && playerState.health < 100;
      eatBtnCtx.clearRect(0, 0, eatBtnCanvas.width, eatBtnCanvas.height);

      drawRoundedRect(eatBtnCtx, 6, 6, eatBtnCanvas.width - 12, 84, 18);
      eatBtnCtx.fillStyle = canEat ? 'rgba(34, 82, 34, 0.96)' : 'rgba(46, 30, 18, 0.92)';
      eatBtnCtx.fill();
      eatBtnCtx.lineWidth = 5;
      eatBtnCtx.strokeStyle = canEat ? '#8be27b' : '#9c7848';
      eatBtnCtx.stroke();

      eatBtnCtx.textAlign = 'center';
      eatBtnCtx.textBaseline = 'middle';
      eatBtnCtx.font = 'bold 28px sans-serif';
      eatBtnCtx.fillStyle = canEat ? '#f3ffe8' : '#cbb698';
      eatBtnCtx.fillText(dict.eatBtn, eatBtnCanvas.width / 2, 50);

      eatBtnTexture.needsUpdate = true;

      // Oppdater 3D EN/NO-knappen på håndleddet
      langWristCtx.clearRect(0, 0, langWristCanvas.width, langWristCanvas.height);
      drawRoundedRect(langWristCtx, 6, 6, langWristCanvas.width - 12, 84, 18);
      langWristCtx.fillStyle = 'rgba(66, 38, 16, 0.96)';
      langWristCtx.fill();
      langWristCtx.lineWidth = 5;
      langWristCtx.strokeStyle = '#ffd275';
      langWristCtx.stroke();

      langWristCtx.textAlign = 'center';
      langWristCtx.textBaseline = 'middle';
      langWristCtx.font = 'bold 26px sans-serif';
      langWristCtx.fillStyle = '#fff5db';
      langWristCtx.fillText(dict.wristLangBtn, langWristCanvas.width / 2, 50);
      langWristTexture.needsUpdate = true;
    }

    let refreshTailorWorkshopHook = null;
    let refreshQuestBoardHook = null;
    let refreshWorldSignsHook = null;
    const TOTAL_QUEST_COUNT = 3;

    function getActiveQuestStatusLine() {
      const dict = L();
      if (activeQuest) {
        const qInfo = dict.quests[activeQuest.id];
        const qTitle = qInfo ? qInfo.title : activeQuest.title;
        return `${dict.questPrefix}: ${qTitle} (${questProgress}/${activeQuest.goal})`;
      }
      if (completedQuests.length >= TOTAL_QUEST_COUNT) {
        return dict.questAllDone;
      }
      return dict.questNone;
    }

    function updateStatusUI() {
      syncLocalizedStateStrings();
      const dict = L();
      document.documentElement.lang = currentLang === 'no' ? 'no' : 'en';
      if (langBtnEl) langBtnEl.textContent = dict.langBtn;
      if (pcHintEl) pcHintEl.innerHTML = dict.pcHintHtml;

      const titleSuffix = playerState.title ? ` | ${dict.hudTitle}: ${playerState.title}` : '';
      const questLine = getActiveQuestStatusLine();
      const summaryText =
        `${dict.hudHealth}: ${playerState.health} | ${dict.hudFood}: ${playerState.food} ${dict.hudEatHint} | ` +
        `${dict.hudPelts}: ${playerState.pelt} | ${dict.hudOutfit}: ${playerState.outfit} | ${dict.hudTime}: ${playerState.timeOfDay} | ` +
        `${dict.hudTargets}: ${playerState.targets}/5${titleSuffix}\n${questLine}`;
      hudEl.textContent = summaryText;

      wristCtx.clearRect(0, 0, wristCanvas.width, wristCanvas.height);

      // Mørk lær-/trebakgrunn med messingramme
      drawRoundedRect(wristCtx, 8, 8, 624, 368, 24);
      wristCtx.fillStyle = 'rgba(38, 22, 11, 0.95)';
      wristCtx.fill();
      wristCtx.lineWidth = 6;
      wristCtx.strokeStyle = '#d9a04e';
      wristCtx.stroke();

      wristCtx.textAlign = 'left';
      wristCtx.textBaseline = 'middle';

      wristCtx.font = 'bold 25px Georgia, serif';
      wristCtx.fillStyle = playerState.title ? '#ffe07a' : '#f2c16b';
      const headerLabel = playerState.title
        ? `${dict.wristLegendPrefix}${playerState.title.toUpperCase()}`
        : dict.wristHeader;
      wristCtx.fillText(headerLabel, 36, 48);

      if (hasSheriffStar) {
        drawSheriffStar2D(wristCtx, 582, 48, 20, 10);
      }

      wristCtx.strokeStyle = 'rgba(217, 160, 78, 0.4)';
      wristCtx.lineWidth = 2;
      wristCtx.beginPath();
      wristCtx.moveTo(36, 78);
      wristCtx.lineTo(604, 78);
      wristCtx.stroke();

      wristCtx.font = 'bold 33px sans-serif';
      wristCtx.fillStyle = '#fff4dc';
      wristCtx.fillText(`${dict.hudHealth}: ${playerState.health}`, 36, 118);
      wristCtx.fillText(`${dict.hudTime}: ${playerState.timeOfDay}`, 350, 118);

      wristCtx.fillText(`${dict.hudFood}: ${playerState.food}`, 36, 174);
      wristCtx.fillText(`${dict.hudPelts}: ${playerState.pelt}`, 350, 174);

      wristCtx.font = 'bold 29px sans-serif';
      wristCtx.fillStyle = '#ffd98e';
      wristCtx.fillText(`${dict.hudOutfit}: ${playerState.outfit}`, 36, 232);

      // Skillelinje før oppdragslinje nederst på wristBoard
      wristCtx.strokeStyle = 'rgba(217, 160, 78, 0.35)';
      wristCtx.beginPath();
      wristCtx.moveTo(36, 272);
      wristCtx.lineTo(604, 272);
      wristCtx.stroke();

      let questFontSize = 27;
      wristCtx.font = `bold ${questFontSize}px sans-serif`;
      while (questFontSize > 19 && wristCtx.measureText(questLine).width > 568) {
        questFontSize -= 1;
        wristCtx.font = `bold ${questFontSize}px sans-serif`;
      }
      wristCtx.fillStyle = activeQuest ? '#a6f096' : '#f5d284';
      wristCtx.fillText(questLine, 36, 320);

      wristTexture.needsUpdate = true;

      updateEatWristButton();
      if (refreshTailorWorkshopHook) refreshTailorWorkshopHook();
      if (refreshQuestBoardHook) refreshQuestBoardHook();
      if (refreshWorldSignsHook) refreshWorldSignsHook();
    }

    function setLanguage(lang) {
      currentLang = lang === 'no' ? 'no' : 'en';
      updateStatusUI();
    }

    function toggleLanguage() {
      setLanguage(currentLang === 'en' ? 'no' : 'en');
    }

    if (langBtnEl) {
      langBtnEl.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleLanguage();
      });
    }

    updateStatusUI();

    // Opprett begge VR-kontrollerne og legg dem i playerRig
    const controllers = [];
    const gripMat = new THREE.MeshStandardMaterial({ color: 0x4a2e18, roughness: 0.8 });
    const barrelMat = new THREE.MeshStandardMaterial({ color: 0x555b62, roughness: 0.4, metalness: 0.6 });

    for (let i = 0; i < 2; i++) {
      const controller = renderer.xr.getController(i);

      // Enkel synlig hånd-/revolvermarkør og siktestråle i VR
      const handMarker = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.14), barrelMat);
      handMarker.name = 'handMarker';
      handMarker.position.set(0, 0, -0.04);
      controller.add(handMarker);

      const handleMesh = new THREE.Mesh(new THREE.BoxGeometry(0.036, 0.08, 0.045), gripMat);
      handleMesh.name = 'handleMesh';
      handleMesh.position.set(0, -0.045, 0.01);
      handleMesh.rotation.x = 0.3;
      controller.add(handleMesh);

      const rayGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -0.1),
        new THREE.Vector3(0, 0, -8)
      ]);
      const rayLine = new THREE.Line(
        rayGeo,
        new THREE.LineBasicMaterial({ color: 0xffe2a0, transparent: true, opacity: 0.65 })
      );
      controller.add(rayLine);

      // Fest håndleddsgruppen (erme, wristBoard og spiseknapp) til kontroller 0 som standard,
      // og flytt automatisk til den kontrolleren WebXR rapporterer som venstre hånd ('left')
      if (i === 0) {
        controller.add(leftWristRig);
      }
      controller.addEventListener('connected', (e) => {
        if (e.data && e.data.handedness === 'left') {
          controller.add(leftWristRig);
        }
      });

      // Vis kontroller-modeller og håndleddstavle i VR (unngår løs stråle på bakken på PC)
      controller.visible = false;

      playerRig.add(controller);
      controllers.push(controller);
    }

    renderer.xr.addEventListener('sessionstart', () => {
      controllers.forEach((c) => { c.visible = true; });
    });
    renderer.xr.addEventListener('sessionend', () => {
      controllers.forEach((c) => { c.visible = false; });
    });

    // =========================================================================
    // 3–6. PBR-TEKSTURER, SKY/PMREM, ØRKENLANDSKAP, SKULPTURERTE MODELLER OG BY
    // =========================================================================
    const M = initTexturesAndMaterials(maxAnisotropy);
    const { windowMat } = M;

    const W = buildEnvironmentAndScenery({ scene, renderer, M, maxAnisotropy });
    const {
      sky, skySunVec, dayEnvRT, nightEnvRT,
      hemiLight, sunLight, sunMesh,
      campfireFlameMeshes, campfireLight, campfireEmberMat
    } = W;

    // --- 5a. Saloon / Oppdragsbygg og «SHERIFF'S BOUNTY BOARD» ---
    const SALOON_QUESTS = [
      { id: 'deer_hunt', goal: 2, targetType: 'deer' },
      { id: 'bandit_clear', goal: 3, targetType: 'bandit' },
      { id: 'night_guardian', goal: 4, targetType: 'night' }
    ];

    let saloonMainSignMesh = null;
    let tailorMainSignMesh = null;
    let safeHouseMainSignMesh = null;
    let safeHouseStreetSignMesh = null;
    let saloonLangSignMesh = null;
    const worldLangButtonMeshes = [];

    let saloonQuestAnchorMesh = null;
    const saloonQuestButtonMeshes = [];
    const saloonQuestBlockMeshes = [];
    let questBoardMessageKey = '';
    let questBoardMessageArg = null;
    let questBoardMessageSuccess = true;
    let questBoardTimer = 0;

    const saloonQuestCanvas = document.createElement('canvas');
    saloonQuestCanvas.width = 1024;
    saloonQuestCanvas.height = 512;
    const saloonQuestCtx = saloonQuestCanvas.getContext('2d');
    const saloonQuestTexture = new THREE.CanvasTexture(saloonQuestCanvas);
    saloonQuestTexture.colorSpace = THREE.SRGBColorSpace;
    saloonQuestTexture.anisotropy = maxAnisotropy;

    function createQuestButtonEntry(quest) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 126;
      const ctx = canvas.getContext('2d');
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = maxAnisotropy;

      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(2.58, 0.31),
        new THREE.MeshBasicMaterial({ map: texture, transparent: true, fog: false, toneMapped: false })
      );
      mesh.userData.quest = quest;
      return { quest, canvas, ctx, texture, mesh };
    }

    const saloonQuestButtonEntries = SALOON_QUESTS.map((q) => createQuestButtonEntry(q));

    function resolveQuestBoardMessage() {
      const dict = L();
      if (!questBoardMessageKey) return '';
      if (questBoardMessageKey === 'done_already') return dict.questMsgDoneAlready;
      if (questBoardMessageKey === 'active_now' && questBoardMessageArg) {
        const q = questBoardMessageArg;
        const qTitle = (dict.quests[q.id] && dict.quests[q.id].title) || q.id;
        return dict.questMsgActiveNow(qTitle, questProgress, q.goal);
      }
      if (questBoardMessageKey === 'accepted' && questBoardMessageArg) {
        const q = questBoardMessageArg;
        const qTitle = (dict.quests[q.id] && dict.quests[q.id].title) || q.id;
        return dict.questMsgAccepted(qTitle);
      }
      if (questBoardMessageKey === 'reward_deer') return dict.questMsgRewardDeer;
      if (questBoardMessageKey === 'reward_bandit') return dict.questMsgRewardBandit;
      if (questBoardMessageKey === 'reward_night') return dict.questMsgRewardNight;
      return questBoardMessageKey;
    }

    function updateSaloonQuestBoardUI() {
      const dict = L();
      saloonQuestCtx.clearRect(0, 0, saloonQuestCanvas.width, saloonQuestCanvas.height);

      drawRoundedRect(saloonQuestCtx, 8, 8, 1008, 496, 22);

    function updateRevolverFX(rev, dt) {
      const data = rev.userData;
      const spring = 320;
      const damping = 24;

      // Fjær/demper gir en kjapp rekyl som vipper opp og faller tilbake.
      // Faste substeg gjør animasjonen stabil også på trege bildefrekvenser.
      let remaining = Math.min(dt, 0.1);
      while (remaining > 0) {
        const step = Math.min(remaining, 1 / 120);
        data.recoilVel += (-spring * data.recoilAngle - damping * data.recoilVel) * step;
        data.recoilAngle += data.recoilVel * step;
        remaining -= step;
      }
      data.recoilAngle = THREE.MathUtils.clamp(data.recoilAngle, -0.08, 0.5);
      data.body.rotation.x = data.recoilAngle;
      data.body.position.z = data.recoilAngle * 0.05;

      if (data.flashTimer > 0) {
        data.flashTimer = Math.max(0, data.flashTimer - dt);
        const t = data.flashTimer / 0.08;
        data.flash.visible = t > 0.02;
        data.flashMat.opacity = t;
        data.flashLight.intensity = 22 * t * t;
        data.flash.scale.setScalar(0.7 + 0.9 * t);
      } else if (data.flash.visible) {
        data.flash.visible = false;
        data.flashLight.intensity = 0;
        data.flashMat.opacity = 0;
      }
    }

    // Prosjektiler fjernes ved treff, bakken, livstid eller maks rekkevidde.
    const PROJECTILE_MAX_HORIZONTAL = 120;
    const PROJECTILE_MAX_HEIGHT = 90;
    const bullets = [];
    const bulletGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.42, 6);
    bulletGeo.rotateX(Math.PI / 2);
    const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffd66b, fog: false });
    const bulletGlowGeo = new THREE.SphereGeometry(0.06, 8, 6);
    const bulletGlowMat = new THREE.MeshBasicMaterial({
      color: 0xffe9a8,
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false
    });

    function spawnBullet(origin, direction) {
      const mesh = new THREE.Group();
      mesh.add(new THREE.Mesh(bulletGeo, bulletMat));
      const glow = new THREE.Mesh(bulletGlowGeo, bulletGlowMat);
      glow.position.z = 0.13;
      mesh.add(glow);

      mesh.position.copy(origin);
      mesh.quaternion.setFromUnitVectors(FORWARD, direction);
      scene.add(mesh);

      bullets.push({
        mesh,
        dir: direction.clone(),
        prev: origin.clone(),
        speed: 62,
        life: 2.5
      });
    }

    function removeBullet(index) {
      // Geometri og materiale er delt mellom alle kuler, så bare scenenoden fjernes.
      scene.remove(bullets[index].mesh);
      bullets.splice(index, 1);
    }

    const impactPuffs = [];
    const impactGeo = new THREE.SphereGeometry(1, 6, 5);

    function spawnImpact(position, color = 0xffdf9c, size = 0.18) {
      const mat = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false
      });
      const mesh = new THREE.Mesh(impactGeo, mat);
      mesh.position.copy(position);
      mesh.scale.setScalar(0.04);
      scene.add(mesh);
      impactPuffs.push({ mesh, mat, life: 0.22, maxLife: 0.22, size });
    }

    function updateImpacts(dt) {
      for (let i = impactPuffs.length - 1; i >= 0; i--) {
        const puff = impactPuffs[i];
        puff.life -= dt;
        const t = 1 - Math.max(0, puff.life) / puff.maxLife;
        puff.mesh.scale.setScalar(0.04 + t * puff.size);
        puff.mat.opacity = Math.max(0, 1 - t) * 0.9;
        puff.mesh.position.y += dt * 0.4;
        if (puff.life <= 0) {
          // Treffeffekten fjernes helt; materialet er unikt, geometrien er delt.
          scene.remove(puff.mesh);
          puff.mat.dispose();
          impactPuffs.splice(i, 1);
        }
      }
    }

    const segA = new THREE.Vector3();
    const segB = new THREE.Vector3();
    const segC = new THREE.Vector3();

    function segmentPointDistance(a, b, p) {
      segA.subVectors(b, a);
      const lenSq = segA.lengthSq();
      const t = lenSq > 0 ? THREE.MathUtils.clamp(segB.subVectors(p, a).dot(segA) / lenSq, 0, 1) : 0;
      return segC.copy(a).addScaledVector(segA, t).distanceTo(p);
    }

    function knockBottle(bottle, direction) {
      const data = bottle.userData;
      data.knocked = true;
      data.vel.copy(direction).multiplyScalar(2.8);
      data.vel.y = 2.9;
      data.vel.x += (Math.random() - 0.5) * 1.6;
      data.vel.z += (Math.random() - 0.5) * 1.6;
      data.angVel.set(
        (Math.random() - 0.5) * 14,
        (Math.random() - 0.5) * 9,
        (Math.random() - 0.5) * 14
      );

      playerState.targets += 1;
      updateStatusUI();
      playBottleHit();

      if (playerState.targets >= practiceBottles.length) {
        targetResetTimer = 2.6;
      }
    }

    const bottleWorldPos = new THREE.Vector3();

    function updateBottles(dt) {
      practiceBottles.forEach((bottle) => {
        const data = bottle.userData;
        if (!data.knocked) return;

        data.vel.y -= 9.8 * dt;
        bottle.position.addScaledVector(data.vel, dt);
        bottle.rotation.x += data.angVel.x * dt;
        bottle.rotation.y += data.angVel.y * dt;
        bottle.rotation.z += data.angVel.z * dt;

        if (bottle.position.y < 0.15) {
          bottle.position.y = 0.15;
          if (data.vel.y < -0.6) {
            data.vel.y *= -0.32;
            data.vel.x *= 0.72;
            data.vel.z *= 0.72;
            data.angVel.multiplyScalar(0.7);
          } else {
            data.vel.y = 0;
            data.vel.x *= 0.9;
            data.vel.z *= 0.9;
            data.angVel.multiplyScalar(0.86);
          }
        }
      });
    }

    const safeHouseDoorBulletCheckPos = new THREE.Vector3();

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        bullet.prev.copy(bullet.mesh.position);
        bullet.mesh.position.addScaledVector(bullet.dir, bullet.speed * dt);
        bullet.life -= dt;

        // Sjekk om kula treffer den tunge Safe House-døren på avstand
        if (safeHouseDoorHitMeshes.length > 0) {
          safeHouseDoorHitMeshes[0].getWorldPosition(safeHouseDoorBulletCheckPos);
          if (
            Math.abs(bullet.mesh.position.y - safeHouseDoorBulletCheckPos.y) < 1.08 &&
            segmentPointDistance(bullet.prev, bullet.mesh.position, safeHouseDoorBulletCheckPos) < 0.68
          ) {
            spawnImpact(bullet.mesh.position, 0xffd28a, 0.16);
            toggleSafeHouseDoor();
            removeBullet(i);
            continue;
          }
        }

        let hitBottle = null;
        let nearest = Infinity;
        for (const bottle of practiceBottles) {
          if (bottle.userData.knocked) continue;
          bottle.getWorldPosition(bottleWorldPos);
          if (segmentPointDistance(bullet.prev, bullet.mesh.position, bottleWorldPos) < 0.17) {
            const distance = bullet.prev.distanceToSquared(bottleWorldPos);
            if (distance < nearest) {
              nearest = distance;
              hitBottle = bottle;
            }
          }
        }

        if (hitBottle) {
          hitBottle.getWorldPosition(bottleWorldPos);
          spawnImpact(bottleWorldPos, 0xffe6a8, 0.2);
          knockBottle(hitBottle, bullet.dir);
          removeBullet(i);
          continue;
        }

        const combatHit = findCombatHit(bullet.prev, bullet.mesh.position);
        if (combatHit) {
          spawnImpact(combatHit.point, 0xffcf8a, 0.18);
          damageCombatTarget(combatHit, bullet.dir);
          removeBullet(i);
          continue;
        }

        const groundY = getTerrainHeight(bullet.mesh.position.x, bullet.mesh.position.z);
        if (bullet.mesh.position.y < groundY + 0.05) {
          spawnImpact(bullet.mesh.position, 0xd9b07c, 0.16);
          removeBullet(i);
          continue;
        }

        if (
          bullet.life <= 0 ||
          Math.abs(bullet.mesh.position.x) > PROJECTILE_MAX_HORIZONTAL ||
          Math.abs(bullet.mesh.position.z) > PROJECTILE_MAX_HORIZONTAL ||
          bullet.mesh.position.y > PROJECTILE_MAX_HEIGHT
        ) {
          removeBullet(i);
        }
      }
    }

    const moveForward = new THREE.Vector3();
    const moveRight = new THREE.Vector3();

    function clampPlayerRig() {
      playerRig.position.x = THREE.MathUtils.clamp(playerRig.position.x, -PLAY_AREA_LIMIT, PLAY_AREA_LIMIT);
      playerRig.position.z = THREE.MathUtils.clamp(playerRig.position.z, -PLAY_AREA_LIMIT, PLAY_AREA_LIMIT);
      playerRig.position.y = getTerrainHeight(playerRig.position.x, playerRig.position.z);
    }

    function moveInLookDirection(strafe, forwardAmount, speed, dt) {
      camera.getWorldDirection(moveForward);
      moveForward.y = 0;
      if (moveForward.lengthSq() < 1e-6) return;
      moveForward.normalize();
      moveRight.crossVectors(moveForward, UP).normalize();

      moveVector.set(0, 0, 0);
      moveVector.addScaledVector(moveForward, forwardAmount);
      moveVector.addScaledVector(moveRight, strafe);
      if (moveVector.lengthSq() > 1) moveVector.normalize();
      if (moveVector.lengthSq() === 0) return;

      playerRig.position.addScaledVector(moveVector, speed * dt);
      clampPlayerRig();
    }

    function updateVRMovement(dt) {
      if (!renderer.xr.isPresenting) return;
      const gamepad = getHandGamepad('left') || (vrHands.left && vrHands.left.userData.gamepad) || null;
      if (!gamepad || !gamepad.axes) return;

      const axisX = gamepad.axes[2] || 0;
      const axisY = gamepad.axes[3] || 0;
      const strafe = Math.abs(axisX) > 0.15 ? axisX : 0;
      const forwardAmount = Math.abs(axisY) > 0.15 ? -axisY : 0;
      if (strafe === 0 && forwardAmount === 0) return;

      moveInLookDirection(strafe, forwardAmount, VR_MOVE_SPEED, dt);
    }

    const pcKeys = Object.create(null);

    function updatePCMovement(dt) {
      if (renderer.xr.isPresenting) return;

      const forwardKey = (pcKeys.KeyW || pcKeys.ArrowUp) ? 1 : 0;
      const backKey = (pcKeys.KeyS || pcKeys.ArrowDown) ? 1 : 0;
      const rightKey = (pcKeys.KeyD || pcKeys.ArrowRight) ? 1 : 0;
      const leftKey = (pcKeys.KeyA || pcKeys.ArrowLeft) ? 1 : 0;

      const forwardAmount = forwardKey - backKey;
      const strafe = rightKey - leftKey;
      if (forwardAmount === 0 && strafe === 0) return;

      moveInLookDirection(strafe, forwardAmount, PC_MOVE_SPEED, dt);
    }

    // Pre-allokert: snap-turn skal ikke lage et nytt Vector3-objekt.
    const snapTurnRotated = new THREE.Vector3();

    function snapTurn(direction) {
      // Roter rundt kameraets posisjon slik at spilleren ikke forskyves i rommet
      playerRig.updateMatrixWorld(true);
      camera.getWorldPosition(rigCamWorld);
      rigCamLocal.copy(camera.position);

      playerRig.rotation.y += direction * SNAP_TURN_ANGLE;

      const rotated = snapTurnRotated.copy(rigCamLocal).applyAxisAngle(UP, playerRig.rotation.y);
      playerRig.position.x = rigCamWorld.x - rotated.x;
      playerRig.position.z = rigCamWorld.z - rotated.z;
      clampPlayerRig();
    }

    function updateSnapTurn(dt) {
      if (!renderer.xr.isPresenting) {
        snapTurnCooldown = 0;
        snapTurnReady = true;
        return;
      }

      snapTurnCooldown = Math.max(0, snapTurnCooldown - dt);
      const gamepad = getHandGamepad('right') || (vrHands.right && vrHands.right.userData.gamepad) || null;
      const axis = gamepad && gamepad.axes ? (gamepad.axes[2] || 0) : 0;

      if (Math.abs(axis) < 0.35) snapTurnReady = true;

      if (snapTurnReady && snapTurnCooldown <= 0 && Math.abs(axis) > 0.65) {
        snapTurn(axis > 0 ? -1 : 1);
        snapTurnReady = false;
        snapTurnCooldown = SNAP_TURN_COOLDOWN;
      }
    }

    function applyDayNightLighting(amount) {
      const night = THREE.MathUtils.clamp(amount, 0, 1);

      // Oppdater Sky-shaderen og solposisjonen for varm solnedgang om dagen og dyp natt
      applySkyShaderParams(sky, night, skySunVec);
      sky.material.opacity = 1;

      // Bytte mellom forhåndsbakt dag- og natt-PMREM for ekte PBR-refleksjon ved 0 ms kostnad
      scene.environment = night > 0.55 ? nightEnvRT.texture : dayEnvRT.texture;
      scene.environmentIntensity = THREE.MathUtils.lerp(0.88, 0.42, night);
      renderer.toneMappingExposure = THREE.MathUtils.lerp(1.06, 0.92, night);

      scene.background.copy(daySkyColor).lerp(nightSkyColor, night);
      scene.fog.color.copy(dayFogColor).lerp(nightFogColor, night);
      scene.fog.near = THREE.MathUtils.lerp(48, 26, night);
      scene.fog.far = THREE.MathUtils.lerp(285, 165, night);

      hemiLight.color.copy(dayHemiSkyColor).lerp(nightHemiSkyColor, night);
      hemiLight.groundColor.copy(dayHemiGroundColor).lerp(nightHemiGroundColor, night);
      hemiLight.intensity = THREE.MathUtils.lerp(0.92, 0.46, night);

      sunLight.color.copy(daySunColor).lerp(nightSunColor, night);
      sunLight.intensity = THREE.MathUtils.lerp(1.9, 0.55, night);
      if (night < 0.85) {
        sunLight.position.set(
          skySunVec.x * 68,
          Math.max(14, skySunVec.y * 85),
          skySunVec.z * 68
        );
      } else {
        sunLight.position.set(-46, 54, -76);
      }

      sunMesh.position.copy(skySunVec).multiplyScalar(225);
      sunMesh.material.opacity = Math.max(0, 1 - night * 1.35) * 0.9;
      sunMesh.visible = night < 0.75;

      moonMesh.material.opacity = night;
      moonHaloMat.opacity = night * 0.52;
      moonGroup.visible = night > 0.02;

      starMat.opacity = Math.max(0, (night - 0.18) / 0.82) * 0.95;
      stars.visible = night > 0.18;

      // Vinduer reflekterer himmelen om dagen og lyser varmt innenfra om natten
      windowMat.color.copy(dayWindowColor).lerp(nightWindowColor, night);
      windowMat.emissiveIntensity = THREE.MathUtils.lerp(0.14, 1.35, night);

      lanternGlassMat.opacity = 0.58 + 0.42 * night;
      lanternGlowMat.opacity = 0.18 + night * 0.68;
      baseLanternIntensity = 0.35 + night * 7.2;
      baseSafeLanternIntensity = 1.65 + night * 5.8;
      baseCampfireIntensity = 2.2 + night * 5.6;
    }

    // Naturlig flakkende lys på lykter og leirbål (kun skalarmatematikk i animasjonsløkken)
    function updateFlickeringLights(t) {
      const f1 = 1.0 + Math.sin(t * 7.3) * 0.07 + Math.sin(t * 17.9) * 0.04;
      const f2 = 1.0 + Math.sin(t * 8.1 + 1.9) * 0.07 + Math.cos(t * 19.3) * 0.04;
      saloonLantern.light.intensity = baseLanternIntensity * f1;
      tailorLantern.light.intensity = baseLanternIntensity * f2;
      safeHouseLantern.light.intensity = baseSafeLanternIntensity * (0.97 + Math.sin(t * 6.4 + 0.7) * 0.05);

      const fireFlicker = 1.0 + Math.sin(t * 11.4) * 0.14 + Math.cos(t * 23.7) * 0.08;
      if (campfireLight) {
        campfireLight.intensity = baseCampfireIntensity * fireFlicker;
      }
      if (campfireEmberMat) {
        campfireEmberMat.emissiveIntensity = 1.1 + Math.sin(t * 5.5) * 0.28 + nightAmount * 0.45;
      }
      for (let i = 0; i < campfireFlameMeshes.length; i++) {
        const fl = campfireFlameMeshes[i];
        const ph = fl.userData.phase;
        const sY = 0.86 + Math.sin(t * 12.5 + ph) * 0.22 + Math.cos(t * 21.0 + ph) * 0.1;
        const sXZ = 0.92 + Math.cos(t * 10.2 + ph) * 0.1;
        fl.scale.set(sXZ, sY, sXZ);
        fl.position.y = fl.userData.baseH * (0.9 + 0.1 * sY);
        fl.rotation.z = Math.sin(t * 8.6 + ph) * 0.12;
      }
    }

    function setTimeOfDay(night, immediate = false) {
      if (isNight === night) return;
      isNight = night;
      isNightStateFlag = night;
      if (immediate) nightAmount = night ? 1 : 0;
      updateStatusUI();

      if (night) {
        for (const deer of deerList) deer.group.visible = false;
        for (const bandit of banditList) {
          bandit.active = false;
          bandit.group.visible = false;
        }
        spawnNightEnemies();
      } else {
        startNightEnemiesBurning();
        resetBanditsForDay();
        for (const deer of deerList) {
          deer.group.visible = deer.alive;
        }
      }

      applyDayNightLighting(nightAmount);
    }

    function toggleDayNight() {
      if (isNight) {
        cycleTime = 0;
        setTimeOfDay(false, true);
      } else {
        cycleTime = DAY_DURATION;
        setTimeOfDay(true, true);
      }
    }

    function updateDayNight(dt) {
      cycleTime += dt;
      if (cycleTime >= FULL_DAY_CYCLE) cycleTime -= FULL_DAY_CYCLE;

      const shouldBeNight = cycleTime >= DAY_DURATION;
      if (shouldBeNight !== isNight) setTimeOfDay(shouldBeNight, false);

      const target = isNight ? 1 : 0;
      nightAmount += (target - nightAmount) * (1 - Math.exp(-dt / 2.2));
      applyDayNightLighting(nightAmount);
    }

        const key = currentOutfitTier === outfit.level ? 'same' : 'better';
        setTailorFeedback(key, false, 3.0);

    // --- 8g. Enkle delte geometrier og materialer for alle skapninger ---
    function faceToward(group, targetX, targetZ) {
      const dx = targetX - group.position.x;
      const dz = targetZ - group.position.z;
      if (dx * dx + dz * dz < 0.0001) return;
      group.rotation.y = Math.atan2(-dx, -dz);
    }

    function moveEntityToward(group, targetX, targetZ, speed, dt, stopDistance = 0) {
      const dx = targetX - group.position.x;
      const dz = targetZ - group.position.z;
      const distance = Math.hypot(dx, dz);
      if (distance < 0.0001) return distance;

      const step = Math.min(speed * dt, Math.max(0, distance - stopDistance));
      if (step <= 0) return distance;

      group.position.x += (dx / distance) * step;
      group.position.z += (dz / distance) * step;
      faceToward(group, targetX, targetZ);
      return distance;
    }

    // --- 8h. Opprett og plasser skapningene (følger terrenghøyden) ---

    // --- 8i. Respawn, dagsreset og nattspawn ---
    function respawnDeer(deer) {
      let x = 0;
      let z = 0;
      for (let attempt = 0; attempt < 10; attempt++) {
        x = THREE.MathUtils.randFloat(FOREST_BOUNDS.minX + 2, FOREST_BOUNDS.maxX - 2);
        z = THREE.MathUtils.randFloat(FOREST_BOUNDS.minZ + 2, FOREST_BOUNDS.maxZ - 2);
        const distance = Math.hypot(x - playerRig.position.x, z - playerRig.position.z);
        if (distance > 15) break;
      }

      deer.alive = true;
      deer.hp = 2;
      deer.state = 'wander';
      deer.deathTimer = 0;
      deer.respawnTimer = 0;
      deer.fleeTimer = 0;
      deer.wanderPause = 0.5 + Math.random() * 2;
      deer.home.set(x, 0, z);
      deer.group.position.set(x, getTerrainHeight(x, z), z);
      deer.group.rotation.set(0, Math.random() * Math.PI * 2, 0);
      deer.group.scale.setScalar(1);
      deer.group.visible = !isNight;
      animateQuadrupedLegs(deer.group, 0, 0);
      chooseDeerTarget(deer);
    }

    function respawnWolf(wolf) {
      wolf.alive = true;
      wolf.hp = 2;
      wolf.state = 'patrol';
      wolf.deathTimer = 0;
      wolf.respawnTimer = 0;
      wolf.attackCooldown = 0;

      wolf.group.scale.setScalar(1);
      wolf.group.visible = true;
      animateQuadrupedLegs(wolf.group, 0, 0);
      chooseWolfTarget(wolf);
    }

    // --- 8j. Skade på skapningene ---
    // Alle våpentreff bruker weaponDamage (1 = standard, 2 = Gull-revolver).
    // Nattmonstre får i tillegg nightMonsterDamage (1 = standard, 2 = Vampyrjeger-sett).
    function damageDeer(deer) {
      if (!deer.alive) return;
      deer.hp -= weaponDamage;
      playFleshHitSound();

      if (deer.hp > 0) {
        deer.state = 'flee';
        deer.fleeTimer = 5;
        return;
      }

      deer.alive = false;
      deer.state = 'dead';
      deer.deathTimer = 1.2;
      deer.respawnTimer = 20;
      deer.group.rotation.z = 0;

      playerState.food += 1;
      playerState.pelt += 1;
      playCollectSound();
      recordQuestKill('deer');
      updateStatusUI();
    }

    function damageWolf(wolf) {
      if (!wolf.alive) return;
      wolf.hp -= weaponDamage;
      playFleshHitSound();

      if (wolf.hp > 0) {
        wolf.state = 'chase';
        wolf.attackCooldown = Math.min(wolf.attackCooldown, 0.4);
        return;
      }

      wolf.alive = false;
      wolf.deathTimer = 1.2;
      wolf.respawnTimer = 20;
      wolf.group.rotation.z = 0;

      playerState.pelt += 1;
      updateStatusUI();
      playCollectSound();
    }

    function damageBandit(bandit) {
      if (!bandit.alive) return;
      bandit.hp -= weaponDamage;
      playFleshHitSound();

      if (bandit.hp > 0) return;

      bandit.alive = false;
      bandit.active = false;
      bandit.deathTimer = 1.2;
      bandit.respawnTimer = 22;
      bandit.group.rotation.z = 0;
      recordQuestKill('bandit');
    }

    function damageNightEnemy(enemy) {
      if (!enemy.alive || enemy.burning) return;
      const totalDamage = weaponDamage * nightMonsterDamage;
      enemy.hp -= totalDamage;
      playFleshHitSound();

      if (enemy.hp > 0) return;

      enemy.alive = false;
      enemy.group.visible = false;
      enemy.group.scale.setScalar(1);
      enemy.respawnTimer = 14;

      nightDeathImpactPosition.copy(enemy.group.position);
      nightDeathImpactPosition.y += 1.0;
      spawnImpact(nightDeathImpactPosition, 0xff3a1f, 0.32);
      recordQuestKill('night');
    }

    // --- 8k. Oppdatering av dyre-, rovdyr-, banditt- og nattmonster-AI ---
    function updateFallingEntity(entity, dt) {
      if (entity.deathTimer <= 0) return;

      entity.deathTimer = Math.max(0, entity.deathTimer - dt);
      const progress = 1 - entity.deathTimer / 1.2;
      entity.group.rotation.z = -Math.PI / 2 * Math.min(1, progress * 1.5);

      if (entity.deathTimer <= 0) {
        entity.group.visible = false;
        entity.group.rotation.z = 0;
      }
    }

    function updateDeer(dt) {
      for (const deer of deerList) {
        if (!deer.alive) {
          updateFallingEntity(deer, dt);
          if (deer.respawnTimer > 0) {
            deer.respawnTimer -= dt;
            if (deer.respawnTimer <= 0) respawnDeer(deer);
          }
          continue;
        }

        if (isNight || !deer.group.visible) continue;

        const distanceToPlayer = Math.hypot(
          deer.group.position.x - playerRig.position.x,
          deer.group.position.z - playerRig.position.z
        );

        if (gunshotAlertTimer > 0 && deer.group.position.distanceTo(lastGunshotPosition) < 30) {
          deer.state = 'flee';
          deer.fleeTimer = Math.max(deer.fleeTimer, 4.5);
        }

        if (distanceToPlayer < 8) {
          deer.state = 'flee';
          deer.fleeTimer = Math.max(deer.fleeTimer, 4);
        }

        let movingSpeed = 0;
        if (deer.state === 'flee') {
          deer.fleeTimer -= dt;

          const dx = deer.group.position.x - playerRig.position.x;
          const dz = deer.group.position.z - playerRig.position.z;
          const len = Math.hypot(dx, dz) || 1;

          moveEntityToward(
            deer.group,
            deer.group.position.x + (dx / len) * 12,
            deer.group.position.z + (dz / len) * 12,
            5.6,
            dt
          );
          movingSpeed = 5.6;

          if (deer.fleeTimer <= 0) {
            deer.state = 'wander';
            deer.wanderPause = 0.8 + Math.random() * 2;
            chooseDeerTarget(deer);
          }
        } else if (deer.wanderPause > 0) {
          deer.wanderPause -= dt;
        } else {
          const dx = deer.wanderTarget.x - deer.group.position.x;
          const dz = deer.wanderTarget.z - deer.group.position.z;

          if (Math.hypot(dx, dz) < 0.8) {
            deer.wanderPause = 1 + Math.random() * 4;
            chooseDeerTarget(deer);
          } else {
            moveEntityToward(deer.group, deer.wanderTarget.x, deer.wanderTarget.z, 1.3, dt);
            movingSpeed = 1.3;
          }
        }

        deer.group.position.x = THREE.MathUtils.clamp(deer.group.position.x, FOREST_BOUNDS.minX, FOREST_BOUNDS.maxX);
        deer.group.position.z = THREE.MathUtils.clamp(deer.group.position.z, FOREST_BOUNDS.minZ, FOREST_BOUNDS.maxZ);
        const groundY = getTerrainHeight(deer.group.position.x, deer.group.position.z);
        if (movingSpeed > 0) {
          deer.stride += dt * (movingSpeed > 3 ? 13 : 6);
          animateQuadrupedLegs(deer.group, deer.stride, movingSpeed > 3 ? 0.48 : 0.24);
          deer.group.position.y = groundY + (movingSpeed > 3 ? Math.abs(Math.sin(deer.stride)) * 0.08 : 0);
        } else {
          animateQuadrupedLegs(deer.group, 0, 0);
          deer.group.position.y = groundY;
        }
      }
    }

    function updateWolves(dt) {
      for (const wolf of wolfList) {
        if (!wolf.alive) {
          updateFallingEntity(wolf, dt);
          if (wolf.respawnTimer > 0) {
            wolf.respawnTimer -= dt;
            if (wolf.respawnTimer <= 0) respawnWolf(wolf);
          }
          continue;
        }

        if (!wolf.group.visible) continue;

        const dx = playerRig.position.x - wolf.group.position.x;
        const dz = playerRig.position.z - wolf.group.position.z;
        const distance = Math.hypot(dx, dz);

        if (distance < 12) wolf.state = 'chase';
        else if (distance > 22) wolf.state = 'patrol';

        let movingSpeed = 0;
        if (wolf.state === 'chase') {
          if (wolf.attackCooldown > 0) wolf.attackCooldown -= dt;

          if (distance > 1.7) {
            moveEntityToward(wolf.group, playerRig.position.x, playerRig.position.z, 4.3, dt, 1.4);
            movingSpeed = 4.3;
          } else {
            faceToward(wolf.group, playerRig.position.x, playerRig.position.z);
            if (wolf.attackCooldown <= 0) {
              wolf.attackCooldown = 1.5;
              damagePlayer(12);
            }
          }
        } else {
          wolf.attackCooldown = Math.max(0, wolf.attackCooldown - dt);

          if (wolf.wanderPause > 0) {
            wolf.wanderPause -= dt;
          } else {
            const targetDx = wolf.wanderTarget.x - wolf.group.position.x;
            const targetDz = wolf.wanderTarget.z - wolf.group.position.z;

            if (Math.hypot(targetDx, targetDz) < 0.8) {
              wolf.wanderPause = 1 + Math.random() * 3;
              chooseWolfTarget(wolf);
            } else {
              moveEntityToward(wolf.group, wolf.wanderTarget.x, wolf.wanderTarget.z, 1.7, dt);
              movingSpeed = 1.7;
            }
          }
        }

        wolf.group.position.x = THREE.MathUtils.clamp(wolf.group.position.x, -82, 82);
        wolf.group.position.z = THREE.MathUtils.clamp(wolf.group.position.z, -82, 82);
        wolf.group.position.y = getTerrainHeight(wolf.group.position.x, wolf.group.position.z);
        if (movingSpeed > 0) {
          wolf.stride += dt * (movingSpeed > 3 ? 12 : 6.5);
          animateQuadrupedLegs(wolf.group, wolf.stride, movingSpeed > 3 ? 0.45 : 0.24);
        } else {
          animateQuadrupedLegs(wolf.group, 0, 0);
        }
      }
    }

    const banditShotOrigin = new THREE.Vector3();
    const banditShotTarget = new THREE.Vector3();
    const banditShotDir = new THREE.Vector3();

    function fireBanditBullet(bandit) {
      bandit.muzzle.getWorldPosition(banditShotOrigin);
      updatePlayerBodyPoints();
      banditShotTarget.copy(playerChestPosition);

      banditShotDir.copy(banditShotTarget).sub(banditShotOrigin).normalize();
      banditShotDir.x += (Math.random() - 0.5) * 0.05;
      banditShotDir.y += (Math.random() - 0.5) * 0.035;
      banditShotDir.z += (Math.random() - 0.5) * 0.05;
      banditShotDir.normalize();

      spawnEnemyBullet(banditShotOrigin, banditShotDir, 24, 15);
      playBanditShotSound();
    }

    function updateBandits(dt) {
      for (const bandit of banditList) {
        if (!bandit.alive) {
          updateFallingEntity(bandit, dt);
          if (!isNight && bandit.respawnTimer > 0) {
            bandit.respawnTimer -= dt;
            if (bandit.respawnTimer <= 0) {
              bandit.alive = true;
              bandit.hp = 3;
              bandit.active = true;
              bandit.deathTimer = 0;
              bandit.cooldown = 1.4;
              bandit.group.position.copy(bandit.spawn);
              bandit.group.rotation.set(0, bandit.baseYaw, 0);
              bandit.group.scale.setScalar(1);
              bandit.group.visible = true;
            }
          }
          continue;
        }

        if (!bandit.active || isNight) continue;

        const dx = playerRig.position.x - bandit.group.position.x;
        const dz = playerRig.position.z - bandit.group.position.z;
        const distance = Math.hypot(dx, dz);

        if (distance < 22) {
          faceToward(bandit.group, playerRig.position.x, playerRig.position.z);
          bandit.cooldown -= dt;

          if (bandit.cooldown <= 0) {
            bandit.cooldown = 2.2;
            fireBanditBullet(bandit);
          }
        } else {
          bandit.cooldown = Math.max(0, bandit.cooldown - dt);
          faceToward(bandit.group, 0, 8);
        }
      }
    }

    function updateNightEnemies(dt) {
      for (let index = 0; index < nightEnemies.length; index++) {
        const enemy = nightEnemies[index];
        if (!enemy.group.visible) {
          if (isNight && !enemy.alive && !enemy.burning && enemy.respawnTimer > 0) {
            enemy.respawnTimer -= dt;
            if (enemy.respawnTimer <= 0) {
              const point = nightRespawnPosition.copy(nightSpawnPoints[index]);
              point.x += (Math.random() - 0.5) * 4;
              point.z += (Math.random() - 0.5) * 4;
              const dx = point.x - playerRig.position.x;
              const dz = point.z - playerRig.position.z;
              const dist = Math.hypot(dx, dz);
              if (dist < 16) {
                const sc = 16 / Math.max(dist, 0.1);
                point.x = playerRig.position.x + dx * sc;
                point.z = playerRig.position.z + dz * sc;
              }
              point.x = THREE.MathUtils.clamp(point.x, -82, 82);
              point.z = THREE.MathUtils.clamp(point.z, -82, 82);
              point.y = getTerrainHeight(point.x, point.z);

              enemy.alive = true;
              enemy.hp = 3;
              enemy.burning = false;
              enemy.burnTimer = 0;
              enemy.attackCooldown = 1.0;
              enemy.group.position.copy(point);
              enemy.group.rotation.set(0, 0, 0);
              enemy.group.scale.setScalar(1);
              enemy.group.visible = true;
              faceToward(enemy.group, playerRig.position.x, playerRig.position.z);
            }
          }
          continue;
        }

        if (enemy.burning) {
          enemy.burnTimer -= dt;
          enemy.group.scale.setScalar(Math.max(0.01, enemy.burnTimer));
          enemy.group.position.y += dt * 1.1;

          if (Math.random() < dt * 14) {
            nightBurnImpactPosition.copy(enemy.group.position);
            nightBurnImpactPosition.y += 0.8;
            spawnImpact(nightBurnImpactPosition, 0xff6a1f, 0.22);
          }

          if (enemy.burnTimer <= 0) {
            enemy.group.visible = false;
            enemy.group.scale.setScalar(1);
            enemy.group.position.y = 0;
            enemy.burning = false;
            enemy.alive = false;
          }
          continue;
        }

        if (!enemy.alive) continue;

        const dx = playerRig.position.x - enemy.group.position.x;
        const dz = playerRig.position.z - enemy.group.position.z;
        const distance = Math.hypot(dx, dz);

        enemy.group.rotation.z = Math.sin(worldTime * 2.4 + index) * 0.04;
        const arms = enemy.group.userData.arms;
        if (arms && arms.length === 2) {
          const clawReach = Math.sin(worldTime * 4.2 + index) * 0.12;
          arms[0].rotation.x = clawReach;
          arms[1].rotation.x = -clawReach;
        }

        if (distance > 1.8) {
          moveEntityToward(enemy.group, playerRig.position.x, playerRig.position.z, 2.35, dt, 1.55);
          enemy.attackCooldown = Math.max(0, enemy.attackCooldown - dt);
        } else {
          faceToward(enemy.group, playerRig.position.x, playerRig.position.z);
          enemy.attackCooldown -= dt;

          if (enemy.attackCooldown <= 0) {
            enemy.attackCooldown = 1.2;
            damagePlayer(20);

            nightAttackImpactPosition.copy(playerChestPosition);
            spawnImpact(nightAttackImpactPosition, 0xff2a2a, 0.18);
          }
        }

        enemy.group.position.x = THREE.MathUtils.clamp(enemy.group.position.x, -82, 82);
        enemy.group.position.z = THREE.MathUtils.clamp(enemy.group.position.z, -82, 82);
        enemy.group.position.y =
          getTerrainHeight(enemy.group.position.x, enemy.group.position.z) +
          0.05 +
          Math.sin(worldTime * 3.1 + index) * 0.045;
      }
    }

    // --- 8l. Bandittkuler og treff på spilleren ---
    const enemyBulletGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.4, 6);
    enemyBulletGeo.rotateX(Math.PI / 2);
    const enemyBulletMat = new THREE.MeshBasicMaterial({ color: 0xff7a3c, fog: false });
    const enemyBulletGlowGeo = new THREE.SphereGeometry(0.07, 6, 4);
    const enemyBulletGlowMat = new THREE.MeshBasicMaterial({
      color: 0xff4a2a,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false
    });
    const enemyBullets = [];

    function spawnEnemyBullet(origin, direction, speed, damage) {
      const mesh = new THREE.Group();
      mesh.add(new THREE.Mesh(enemyBulletGeo, enemyBulletMat));

      const glow = new THREE.Mesh(enemyBulletGlowGeo, enemyBulletGlowMat);
      glow.position.z = 0.12;
      mesh.add(glow);

      mesh.position.copy(origin);
      mesh.quaternion.setFromUnitVectors(FORWARD, direction);
      scene.add(mesh);

      enemyBullets.push({
        mesh,
        dir: direction.clone(),
        prev: origin.clone(),
        speed,
        damage,
        life: 4
      });
    }

    function removeEnemyBullet(index) {
      // Delt geometri/materiale – fjern bare scenenoden.
      scene.remove(enemyBullets[index].mesh);
      enemyBullets.splice(index, 1);
    }

    function updateEnemyBullets(dt) {
      updatePlayerBodyPoints();

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const bullet = enemyBullets[i];
        bullet.prev.copy(bullet.mesh.position);
        bullet.mesh.position.addScaledVector(bullet.dir, bullet.speed * dt);
        bullet.life -= dt;

        const headHit = segmentPointDistance(bullet.prev, bullet.mesh.position, playerHeadPosition) < 0.42;
        const chestHit = segmentPointDistance(bullet.prev, bullet.mesh.position, playerChestPosition) < 0.5;

        if (headHit || chestHit) {
          damagePlayer(bullet.damage);
          spawnImpact(bullet.mesh.position, 0xff4030, 0.16);
          removeEnemyBullet(i);
          continue;
        }

        const enemyGroundY = getTerrainHeight(bullet.mesh.position.x, bullet.mesh.position.z);
        if (bullet.mesh.position.y < enemyGroundY + 0.05) {
          spawnImpact(bullet.mesh.position, 0xd9b07c, 0.14);
          removeEnemyBullet(i);
          continue;
        }

        if (
          bullet.life <= 0 ||
          Math.abs(bullet.mesh.position.x) > PROJECTILE_MAX_HORIZONTAL ||
          Math.abs(bullet.mesh.position.z) > PROJECTILE_MAX_HORIZONTAL ||
          bullet.mesh.position.y > PROJECTILE_MAX_HEIGHT
        ) {
          removeEnemyBullet(i);
        }
      }
    }

    // --- 8m. Finn spillerkulas treff blant alle skapninger ---
    // Gjenbruker combatHitResult og unngår et nytt objekt + Vector3 per treff.
    function considerCombatTarget(a, b, entity, type, centerY, radius) {
      if (!entity.alive || !entity.group.visible || entity.burning) return;

      combatCenter.set(
        entity.group.position.x,
        entity.group.position.y + centerY,
        entity.group.position.z
      );

      if (segmentPointDistance(a, b, combatCenter) >= radius) return;

      const distance = a.distanceToSquared(combatCenter);
      if (distance < combatHitBestDistance) {
        combatHitBestDistance = distance;
        combatHitFound = true;
        combatHitResult.type = type;
        combatHitResult.entity = entity;
        combatHitResult.point.copy(combatCenter);
      }
    }

    function findCombatHit(a, b) {
      combatHitFound = false;
      combatHitBestDistance = Infinity;
      combatHitResult.type = '';
      combatHitResult.entity = null;

      for (const deer of deerList) {
        considerCombatTarget(a, b, deer, 'deer', 0.95, 0.8);
      }
      for (const wolf of wolfList) {
        considerCombatTarget(a, b, wolf, 'wolf', 0.6, 0.62);
      }
      for (const bandit of banditList) {
        considerCombatTarget(a, b, bandit, 'bandit', 1.0, 0.66);
      }
      for (const enemy of nightEnemies) {
        considerCombatTarget(a, b, enemy, 'night', 1.0, 0.7);
      }

      return combatHitFound ? combatHitResult : null;
    }

    function damageCombatTarget(hit, direction) {
      if (hit.type === 'deer') damageDeer(hit.entity, direction);
      else if (hit.type === 'wolf') damageWolf(hit.entity, direction);
      else if (hit.type === 'bandit') damageBandit(hit.entity, direction);
      else if (hit.type === 'night') damageNightEnemy(hit.entity, direction);
    }

    // --- 8n. Plasser alle skapningene i verdenen ---
    deerHomes.forEach((home) => createDeerAt(home.x, home.z));
    wolfHomes.forEach((home) => createWolfAt(home.x, home.z));
    banditPosts.forEach((post, index) => createBanditAt(post, index));
    for (let i = 0; i < 5; i++) createNightEnemyAt(i);

    // --- 8o. VR-kontrollerknapper: høyre grip = spis mat, venstre grip/trigger = dag/natt (eller butikk) ---
    function tryVRDayNightToggle(controller, data) {
      if (!renderer.xr.isPresenting) return;

      const handedness = data && data.handedness;
      const isLeft = handedness === 'left' || (!handedness && vrHands.left === controller);
      if (!isLeft) return;

      const now = performance.now();
      if (now - lastVRDayNightToggle < 350) return;
      lastVRDayNightToggle = now;
      toggleDayNight();
    }

    controllers.forEach((controller) => {
      controller.addEventListener('squeezestart', (e) => {
        if (!renderer.xr.isPresenting) return;
        const data = e.data || {};
        const handedness = data.handedness;
        const isRight = handedness === 'right' || (!handedness && vrHands.right === controller);
        if (isRight) {
          tryEatFood();
          return;
        }
        tryVRDayNightToggle(controller, data);
      });

      controller.addEventListener('selectstart', (e) => {
        if (!renderer.xr.isPresenting) return;
        const data = e.data || {};
        const handedness = data.handedness;
        const isLeft = handedness === 'left' || (!handedness && vrHands.left === controller);
        if (isLeft) {
          if (tryVRLeftTriggerShopUI(controller)) return;
          tryVRDayNightToggle(controller, data);
        }
      });
    });

    // =========================================================================
    // 9. PC-KAMERAKONTROLL (DRA MED MUS FOR Å SE SEG RUNDT) OG RESIZE
    // =========================================================================
    let isDragging = false;
    let prevPointerX = 0;
    let prevPointerY = 0;
    let pcPitch = 0;

    function resetPCCameraPitch() {
      pcPitch = 0;
      camera.rotation.x = 0;
    }

    let pointerDownX = 0;
    let pointerDownY = 0;
    let pointerMoved = false;
    let pointerCanShoot = false;

    window.addEventListener('pointerdown', (e) => {
      if (renderer.xr.isPresenting) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      // Ikke skyt når man trykker på VR-knappen eller andre knapper
      const onButton = !!(e.target && e.target.closest && e.target.closest('button'));
      pointerCanShoot = e.button === 0 && !onButton;
      pointerMoved = false;
      pointerDownX = e.clientX;
      pointerDownY = e.clientY;
      isDragging = true;
      prevPointerX = e.clientX;
      prevPointerY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || renderer.xr.isPresenting) return;
      const dx = e.clientX - prevPointerX;
      const dy = e.clientY - prevPointerY;
      prevPointerX = e.clientX;
      prevPointerY = e.clientY;

      // Bevegelse utover en liten terskel betyr at man drar kameraet, ikke klikker
      if (Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY) > 6) {
        pointerMoved = true;
      }

      playerRig.rotation.y -= dx * 0.004;
      pcPitch = Math.max(-0.6, Math.min(0.6, pcPitch - dy * 0.003));
      camera.rotation.x = pcPitch;
    });

    window.addEventListener('pointerup', (e) => {
      if (!renderer.xr.isPresenting && pointerCanShoot && !pointerMoved) {
        if (!tryPCShopInteraction(e.clientX, e.clientY)) {
          shoot();
        }
      }
      pointerCanShoot = false;
      isDragging = false;
    });

    window.addEventListener('pointercancel', () => {
      pointerCanShoot = false;
      isDragging = false;
    });

    // Nullstill PC-pitch når man går inn i VR slik at headsettet styrer kameraet rent
    renderer.xr.addEventListener('sessionstart', () => {
      camera.rotation.set(0, 0, 0);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 11. HOVEDLØKKE
    // =========================================================================
    const clock = new THREE.Clock();

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      worldTime += dt;

      // Dag/natt-syklus, flakkende lykter/leirbål, svevende støvkorn/glør, helse og skadetimere
      updateDayNight(dt);
      updateFlickeringLights(worldTime);
      updateBackgroundAmbience(dt);
      updatePlayerStatus(dt);

      // Tidsbegrenset statusmelding på skreddertavlen og oppdragstavlen + skredder- og Safe House-døranimasjon
      if (tailorStatusTimer > 0) {
        tailorStatusTimer = Math.max(0, tailorStatusTimer - dt);
        if (tailorStatusTimer === 0) {
          tailorStatusMessageKey = '';
          updateTailorWorkshopUI();
        }
      }
      if (questBoardTimer > 0) {
        questBoardTimer = Math.max(0, questBoardTimer - dt);
        if (questBoardTimer === 0) {
          questBoardMessageKey = '';
          questBoardMessageArg = null;
          updateSaloonQuestBoardUI();
        }
      }
      if (tailorNPCGroup) {
        tailorNPCGroup.rotation.y = 0.14 + Math.sin(worldTime * 1.4) * 0.08;
      }
      if (safeHouseDoorPivot) {
        const targetDoorAngle = safeHouseDoorOpen ? 1.62 : 0;
        safeHouseDoorAngle += (targetDoorAngle - safeHouseDoorAngle) * Math.min(1, dt * 8.5);
        safeHouseDoorPivot.rotation.y = safeHouseDoorAngle;
      }

      // Bevegelse: venstre spak i VR, WASD/piltaster på PC
      updateVRMovement(dt);
      updatePCMovement(dt);
      updateSnapTurn(dt);
      updatePlayerBodyPoints();

      // Skapninger, fiender og bandittkuler
      updateDeer(dt);
      updateWolves(dt);
      updateBandits(dt);
      updateNightEnemies(dt);
      updateEnemyBullets(dt);

      // Skyting: kuler, treff, blinkfysikk, støvkorn/glør og visuelle effekter
      updateBullets(dt);
      updateBottles(dt);
      updateImpacts(dt);
      updateAmbientParticles(dt, playerRig.position, nightAmount, worldTime);
      updateDamageVignette(dt);

      updateRevolverFX(pcRevolver, dt);
      if (vrRevolver) updateRevolverFX(vrRevolver, dt);

      // Nullstill blinkene automatisk litt etter at alle er truffet
      if (targetResetTimer > 0) {
        targetResetTimer -= dt;
        if (targetResetTimer <= 0) resetTargets();
      }

      renderer.render(scene, camera);
    });



  </script>
</body>
