name: Sync CC0 Assets & Missing GLB Fallbacks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_cc0_assets.py'
      - '.github/workflows/generate-glb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch missing CC0 HDRIs, PBR textures & protected CC0 GLBs
        run: |
          if [ -f scripts/fetch_cc0_assets.py ]; then
            python3 -B scripts/fetch_cc0_assets.py
          fi
      - name: Generate ONLY missing .glb models (never overwrite existing ./assets/*.glb)
        run: |
          if [ -f scripts/generate_assets.py ]; then
            python3 -B scripts/generate_assets.py --skip-existing
          fi
      - name: Commit and push new assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/env/*.hdr assets/textures/*.jpg assets/*.glb || true
          if ! git diff --cached --quiet; then
            git commit -m "Sync CC0 HDRIs, 1K PBR textures and protected .glb assets"
            git pull --rebase origin main
            git push origin main
          fi
