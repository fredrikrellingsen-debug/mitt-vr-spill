name: Sync CC0 Assets & Protected GLB Models

on:
  push:
    branches: [main]
    paths:
      - 'scripts/*.py'
      - '.github/workflows/generate-glb.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch missing CC0 HDRIs, PBR textures & missing-only GLB fallbacks
        run: |
          if [ -f scripts/fetch_cc0_assets.py ]; then
            python3 -B scripts/fetch_cc0_assets.py
          fi
      - name: Build missing or legacy procedural GLBs (external .glb files are never overwritten)
        run: |
          if [ -f scripts/generate_assets.py ]; then
            python3 -B scripts/generate_assets.py --upgrade-subdiv
          fi
      - name: Commit and push updated assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/env/*.hdr assets/textures/*.jpg assets/*.glb assets/external-models.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Build subdivided 2.0 procedural GLBs & preserve external assets"
            git pull --rebase origin main
            git push origin main
          fi
